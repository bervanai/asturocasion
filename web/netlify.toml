[build]
  command = "npm install --legacy-peer-deps && npm install serverless-http && npx vite build && node scripts/generate-seo.mjs"
  publish = "dist/public"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Legacy WordPress URLs (indexed by Google) → new catalogue, 301 so link
# equity transfers and the old thin/duplicate pages drop out of the index.
[[redirects]]
  from = "/coches-de-segunda-mano-y-ocasion/*"
  to = "/catalogo"
  status = 301
  force = true

# SPA fallback. Not forced, so physical files generated by scripts/generate-seo.mjs
# (per-route index.html) are served first; everything else falls back to the app.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
